<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রেজিস্ট্রেশন লিংকে নেওয়া হচ্ছে | Premium কোর্স</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        !function (f, b, e, v, n, t, s) {
            if (f.fbq) return; n = f.fbq = function () {
                n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments)
            };
            if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0';
            n.queue = []; t = b.createElement(e); t.async = !0; t.src = v;
            s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s)
        }(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '1467019555437463');
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');

        body { font-family: 'Hind Siliguri', Inter, ui-sans-serif, system-ui, sans-serif; background: radial-gradient(circle at 50% 0%, #32105c, #080414 55%, #04020c); color: #fff; min-height: 100vh; }
        .card { background: rgba(16, 8, 38, .78); border: 1px solid rgba(246, 201, 79, .28); box-shadow: 0 28px 70px rgba(0,0,0,.5); }
        .cta { background: linear-gradient(135deg, #fff1a5, #e8ae20 40%, #ffda59 65%, #a86a08); color: #170a02; box-shadow: 0 12px 30px rgba(232,174,32,.28); transition: transform .2s ease; }
        .cta:hover { transform: translateY(-2px); }
        .count { background: radial-gradient(circle at 35% 28%, #fff4b4, #e9b52f 48%, #76430c); color: #170a02; box-shadow: 0 0 36px rgba(245, 190, 50, .4); }
    </style>
</head>

<body>
    <script>fbq('trackCustom', 'redirection-page-view');</script>
    <main class="flex min-h-screen items-center justify-center p-4">
        <section class="card w-full max-w-xl rounded-3xl p-7 text-center sm:p-12">
            <p class="text-sm font-bold tracking-[.18em] text-yellow-300">Premium কোর্স · বিশেষ কর্মশালা</p>
            <h1 class="mt-4 text-3xl font-black sm:text-4xl">আপনার রেজিস্ট্রেশন লিংক খোলা হচ্ছে</h1>
            <p class="mt-4 text-base leading-relaxed text-violet-100/85">অনুগ্রহ করে কয়েক সেকেন্ড অপেক্ষা করুন। কোর্সে যোগ দেওয়ার জন্য আপনাকে Premium WhatsApp গ্রুপে নিয়ে যাওয়া হবে।</p>
            <div id="countdown" class="count mx-auto mt-8 flex h-28 w-28 items-center justify-center rounded-full text-5xl font-black">৩</div>
            <p id="statusText" class="mt-5 font-semibold text-yellow-200">৩ সেকেন্ডের মধ্যে রিডাইরেক্ট করা হচ্ছে...</p>
            <a href="https://chat.whatsapp.com/EQuTgU7tFs8Je0VsJvYAbQ" class="cta mt-8 inline-flex rounded-xl px-7 py-4 text-lg font-black">এখনই WhatsApp গ্রুপে যোগ দিন</a>
            <p class="mt-5 text-sm text-violet-200">রিডাইরেক্ট না হলে উপরের বাটনটি ব্যবহার করুন।</p>
        </section>
    </main>
    <script>
        const targetUrl = 'https://chat.whatsapp.com/EQuTgU7tFs8Je0VsJvYAbQ';
        const countdownElement = document.getElementById('countdown');
        const statusText = document.getElementById('statusText');
        const bengaliNumbers = ['০', '১', '২', '৩'];
        let timeLeft = 2;
        const tick = () => {
            countdownElement.textContent = bengaliNumbers[timeLeft];
            statusText.textContent = `${bengaliNumbers[timeLeft]} সেকেন্ডের মধ্যে রিডাইরেক্ট করা হচ্ছে...`;
            if (timeLeft === 0) { statusText.textContent = 'এখন আপনাকে WhatsApp গ্রুপে নেওয়া হচ্ছে...'; window.location.href = targetUrl; return; }
            timeLeft -= 1;
            setTimeout(tick, 1000);
        };
        tick();
    </script>
</body>
</html>
